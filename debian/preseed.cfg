#_preseed_V1
# This file is embedded in the initrd, before network configuration.
d-i debian-installer/locale string @LOCALE@
d-i keyboard-configuration/xkb-keymap select @KEYBOARD@
d-i keyboard-configuration/layoutcode string @KEYBOARD@
# These package-owned selections also reach the installed system's debconf database.
keyboard-configuration keyboard-configuration/model select Generic 105-key PC
keyboard-configuration keyboard-configuration/modelcode string pc105
keyboard-configuration keyboard-configuration/layoutcode string @KEYBOARD@
keyboard-configuration keyboard-configuration/variantcode string
# The installed package asks a separate variant question even when its code is empty.
keyboard-configuration keyboard-configuration/variant select
keyboard-configuration keyboard-configuration/variant seen true
keyboard-configuration keyboard-configuration/optionscode string
# A bounded wired-DHCP hook runs after driver detection, avoiding netcfg's error prompts.
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string debian
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean true
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password @ROOT_YESCRYPT@
d-i passwd/make-user boolean true
d-i passwd/user-fullname string @FULL_NAME@
d-i passwd/username string @USERNAME@
d-i passwd/user-password-crypted password @YESCRYPT@
d-i passwd/user-default-groups string sudo
d-i clock-setup/utc boolean true
d-i time/zone string @TIMEZONE@
d-i clock-setup/ntp boolean false
# All packages come from DVD-1; the late hook attempts signed security updates.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/non-free-firmware boolean true
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string openssh-server sudo efibootmgr dhcpcd-base ca-certificates ifupdown console-setup keyboard-configuration shim-signed @SIGNED_GRUB@
d-i pkgsel/upgrade select none
d-i base-installer/install-recommends boolean false
popularity-contest popularity-contest/participate boolean false
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/early_command string /bin/sh /zapdos/network.sh; /bin/sh /zapdos/disk.sh || /bin/sh /zapdos/stop.sh
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/force-efi-extra-removable boolean false
d-i grub-installer/secure_boot boolean true
d-i preseed/early_command string /bin/sh /zapdos/early.sh || /bin/sh /zapdos/stop.sh
d-i preseed/late_command string /bin/sh /zapdos/late.sh || /bin/sh /zapdos/stop.sh
d-i cdrom-detect/eject boolean false
d-i finish-install/reboot_in_progress note
# Power off when finished: remove the USB, then power on to boot the installed system.
d-i debian-installer/exit/poweroff boolean true
